research:
- id: adam-convergence
  title: On the Convergence of Adam, Revisited
  dates: '2026'
  resume_group: University of Southern California
  subtitle: Joint work with Prof. Steven Heilman
  bullets:
  - Show that projected Adam for online optimization can have average regret bounded away from zero
    for any moment decay parameters in [0,1), extending counterexamples to multiple Adam variants.
  links:
  - label: Preprint
    url: https://arxiv.org/abs/2607.03519
  short_description: Show projected Adam can have nonvanishing average regret in online optimization
    for any moment decay parameters in [0,1); extend counterexamples to multiple variants.
  short_subtitle: with Prof. Steven Heilman
- id: optimizer-comparison
  title: Random Search, Evolution Strategies, and Gradient Descent for Neural Network Optimization
  dates: '2026'
  resume_group: University of Southern California
  bullets:
  - Compare SGD, Adam, and AMSGrad with random search, evolution strategies, and four hybrid optimization
    schemes on MNIST/EMNIST.
  - Study low-rank perturbations (EGGROLL), gradient-based adaptations (LoRA), and low-rank initialization
    across optimizer families.
  - Connect empirical experiments with theoretical Adam convergence analysis and mentored research on
    ARS and Natural Evolutionary Strategies.
  context: 'Interactive empirical comparison of gradient-based optimizers (SGD, Adam, AMSGrad) against
    gradient-free optimizers (random search, evolution strategies) and four hybrid random-search/gradient-descent
    schemes, training on MNIST/EMNIST. Studies the effect of low-rank weight structure on each optimizer
    family — EGGROLL for random search/evolution strategies, LoRA for gradient-based methods — as well
    as low-rank weight initialization. Complements the theoretical convergence analysis in "On the Convergence
    of Adam, Revisited" and the evolution-strategy family of methods (ARS, Natural Evolutionary Strategies)
    explored in mentored student research. Directly inspired by ["Evolution Strategies at the Hyperscale"](https://eshyperscale.github.io/)
    (Sarkar et al.), which introduces the EGGROLL low-rank perturbation method for scaling evolution strategies,
    and ["Neural Thickets: Diverse Task Experts Are Dense Around Pretrained Weights"](https://arxiv.org/abs/2603.12228)
    (Gan and Isola), which shows that pretrained-weight neighborhoods are dense with viable task-specific
    solutions reachable by simple random sampling.'
  short_description: Compare gradient-based, evolutionary, and hybrid optimizers on MNIST/EMNIST with
    low-rank perturbations and initialization; inspired by [EGGROLL](https://eshyperscale.github.io/)
    and [Neural Thickets](https://arxiv.org/abs/2603.12228).
- id: llm-safety
  title: Structural Analysis of LLM Weights and Activations
  dates: 2025 - 2026
  resume_group: University of Southern California
  subtitle: In collaboration with Amazon
  bullets:
  - Investigate how safety-relevant behavior is encoded in LLM weights and representations, in collaboration
    with Amazon.
  - Characterize low-rank and sparse structure across Gemma attention and MLP layers to study safety localization.
  - Compare base and safety-aligned models using layer-wise activations, linear probes, and geometric
    analysis (PCA, UMAP, LDA, and concept activation vectors).
  - Test zero-shot and few-shot safety probes and activation steering in SmolLM2/SmolLM3; examine token-position
    effects and refusal/compliance behavior.
  context: 'Investigating how safety-relevant behavior is structurally and representationally encoded
    in large language models, along three complementary directions. **Weight-space analysis**: decomposing
    weight matrices across all transformer layers — attention and MLP components — using linear algebraic
    methods to characterize their low-rank and sparse structure, and studying how these properties vary
    across layer depth and type to understand safety localization. Experiments conducted on open-weight
    models from the Gemma family. **Activation-space analysis**: comparing a base model (DeepSeek-R1-Distill-Qwen-7B)
    against its safety-aligned counterpart (RealSafe-R1-7B) on paired benign/unsafe prompts, extracting
    layer-wise activations and evaluating linear separability via probing and geometric analysis (PCA,
    UMAP, LDA, concept activation vectors) to characterize where and how safety-relevant signal is encoded,
    including ongoing investigation of token-position effects on separability. **In-context and behavioral
    probing**: on the SmolLM2/SmolLM3 model family, comparing zero-shot versus few-shot (in-context) prompting
    effects on last-token safety-probe directions, and using activation steering to test whether representation-level
    safety probes correspond to actual refusal/compliance behavior, motivating an ongoing comparison of
    content-harmfulness probes against behavior-labeled refusal probes.'
  short_description: Investigate safety behavior through low-rank/sparse weights, activations, and steering
    across Gemma, DeepSeek/Qwen, RealSafe, and SmolLM models.
  short_subtitle: with Amazon
- id: leap
  title: LEAP - Live Experiments for Active Pedagogy
  dates: 2025 - Present
  resume_group: University of Southern California
  bullets:
  - Built an open-source platform for collaborative classroom experiments with remote function calls,
    participation analytics, and reusable labs in optimization, ML, and algorithms.
  - Extended LEAP2 with Python, JavaScript, Julia, C, and C++ clients, a lab CLI, isolated DuckDB databases,
    access controls, rate limiting, hot reload, and a git-based experiment registry.
  - Poster published at ACM SIGCSE 2026.
  context: 'Developed open-source framework enabling collaborative hands-on experimentation in live CS
    classrooms, allowing students to discover and call instructor-defined functions remotely. System logs
    all interactions with timestamps for real-time visualization of participation, solution strategies,
    and common errors. Supports courses in numerical analysis, optimization, ML, and algorithms with example
    labs including gradient descent visualization, Monte Carlo integration, genetic algorithms with leaderboards,
    and graph traversal. Features security controls, analytics dashboards, and standardized lab format
    for community sharing. LEAP2 extended the platform with multi-language client support (Python, JavaScript,
    Julia, C, C++), a CLI for lab management and experiment scaffolding, per-experiment isolation with
    DuckDB databases, a decorator system for access control and rate limiting, hot-reloadable functions,
    and a git-based community registry for sharing and discovering experiments. Status: Poster published
    at ACM SIGCSE 2026.'
  links:
  - label: Paper
    url: https://doi.org/10.1145/3770761.3777313
  - label: Code
    url: https://github.com/neveisa/leap
  short_description: Built collaborative experiments with analytics, multilingual clients, isolated databases,
    access controls, and a shared registry; ACM SIGCSE 2026 poster.
- id: tensor-imputation
  title: Tensor Methods for Traffic Data Analysis and Imputation
  dates: 2022 - 2025
  resume_group: University of Southern California
  bullets:
  - Developed SATORIS, a low-rank matrix/tensor framework exploiting temporal invariance of factor subspaces
    for traffic-data imputation.
  - Designed KSV, KTF, USV, and UTF algorithms using modified alternating least squares; extended SATORIS-N
    with subspace-informed nuclear-norm minimization.
  - Evaluated Beijing and Shanghai taxi-GPS data against classical and learned baselines,
    including settings with more than 70% missing data.
  - SATORIS-N accepted at IEEE IV 2026; SATORIS submitted to IEEE Access (under review).
  context: 'Developed low-rank tensor and matrix decomposition methods for spatio-temporal traffic
    data imputation. Introduced SATORIS (Singular vAlue and TensOR weIght regresSion), a unified framework exploiting
    temporal invariance of subspaces across proximate days. Developed four algorithms (KSV, KTF, USV, UTF) spanning known-factor and
    unknown-factor regimes using modified Alternating Least Squares. Extended framework to SATORIS-N using
    nuclear-norm minimization within SDP formulation with prior subspace injection. Evaluated
    Beijing and Shanghai GPS datasets against
    baselines including mean/median imputation, k-NN, SoftImpute, GAIN,
    and Miracle, including high occlusion levels (>70% missing data). Status: SATORIS paper submitted
    to IEEE Access (under review); SATORIS-N accepted at IEEE Intelligent Vehicles Symposium (IV), 2026.'
  links:
  - label: SATORIS-N paper
    url: https://arxiv.org/abs/2602.03138
  short_description: Developed low-rank and subspace-informed recovery on Beijing/Shanghai data with >70%
    missing values; IEEE IV 2026 acceptance and IEEE Access submission (under review).
