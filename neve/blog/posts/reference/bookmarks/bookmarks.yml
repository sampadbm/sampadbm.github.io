bookmarks:
  - title: Jason Rennie — Writings
    url: http://qwone.com/~jason/writing/
    category: Blog
    description: Collection of technical notes and derivations — matrix calculus, factor analysis, trace norm priors, exponential families, and related machine learning topics.
    tags: [matrix-calculus, machine-learning, derivations, factor-analysis, trace-norm, notes]

  - title: "マリウス (Marius)"
    url: "https://マリウス.com/"
    category: Blog
    description: Personal journal on tech, open-source, hardware, travel, and digital minimalism.
    tags: [linux, open-source, hardware, privacy, digital-minimalism]

  - title: Ethan Epperly — Trace Estimation
    url: https://www.ethanepperly.com/index.php/category/trace-estimation/
    category: Blog
    description: Blog posts on stochastic trace estimation and numerical linear algebra.
    tags: [numerical-linear-algebra, trace-estimation, randomized-algorithms, matrix-analysis]

  - title: Elements of a Vector Space — Elon Litman
    url: https://elonlit.com/about/
    category: Blog
    description: Stanford researcher's blog on deep learning theory, generalization, optimal transport, information theory, and random matrices.
    tags: [deep-learning-theory, generalization, optimal-transport, information-theory, random-matrices]

  - title: Gregory Gundersen — Blog
    url: https://gregorygundersen.com/blog/
    category: Blog
    description: Technical blog on math, statistics, and machine learning with an emphasis on rigorous derivations and clear intuition — PCA, SVD, the Gauss–Markov theorem, Bayesian linear regression, and options pricing among the topics.
    tags: [statistics, probability, machine-learning, linear-algebra, bayesian-inference, derivations]

  - title: Laws of Software
    url: https://www.laws-of-software.com/
    category: Reference
    description: Curated collection of named laws, principles, and observations in software engineering and systems design — Gall's Law, Conway's Law, Hyrum's Law, Goodhart's Law, and ~25 others.
    tags: [software-engineering, systems-design, principles, reference]

  - title: Patrick Kidger
    url: https://kidger.site/
    category: Blog
    description: Personal site of Patrick Kidger (DPhil, Oxford) — neural differential equations, JAX ecosystem (Equinox, Diffrax, Optimistix), and scientific machine learning.
    tags: [jax, neural-differential-equations, scientific-machine-learning, equinox, diffrax]

  - title: William G. Faris — Books Online
    url: https://archive.math.arizona.edu/faris/books.html
    category: Reference
    description: Free PDF drafts of six books by William G. Faris (University of Arizona) — Quantum Dynamics (first chapters), Martingale Ideas in Elementary Probability, Vector Fields and Differential Forms, Real Analysis Structures, The Science of Proof (mathematical reasoning and its limitations), and Shanghai Lectures on Multivariable Analysis.
    tags: [mathematics, books, real-analysis, differential-forms, probability, martingales, quantum-mechanics, logic, reference]

  - title: William G. Faris — Lecture Notes
    url: https://archive.math.arizona.edu/faris/lecturenotes.html
    category: Reference
    description: Free PDF lecture notes by William G. Faris (University of Arizona) on numerical analysis, ODEs, elementary and advanced PDEs, integration, stochastic processes, elementary probability, methods of applied mathematics, linear algebra, theory of statistics, and an introduction to quantum theory.
    tags: [mathematics, lecture-notes, applied-mathematics, pde, ode, probability, stochastic-processes, statistics, numerical-analysis, reference]

  - title: Mapademic
    url: https://mapademic.app
    category: Tools
    description: Free, browser-based interactive map of ~8.4 million researchers built from OpenAlex — authors are placed near their frequent coauthors and colored by research community, with search, top-coauthor links, and shortest coauthor paths between any two researchers (showing the paper behind each link). Made by Eric Gao (UC San Diego).
    tags: [research, coauthorship, scientometrics, openalex, visualization, academic-networks]

  - title: Anki
    url: https://apps.ankiweb.net/
    category: Tools
    description: Free, open-source flashcard app that schedules reviews with spaced repetition (SM-2 or the newer FSRS scheduler). Desktop app with AnkiWeb sync; add-ons like AnkiConnect expose a local API for scripting.
    tags: [spaced-repetition, flashcards, learning, memory, open-source]
