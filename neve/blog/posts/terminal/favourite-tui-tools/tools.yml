    description: transfer clipboard screenshots to remote SSH servers, so you can paste images into AI coding tools over SSH

  - title: wifitui
    category: System & Networking
    description: WiFi manager

  - title: mdns-scanner
    category: System & Networking
    description: mDNS network scanner

  - title: mdns-browser
