    description: interactive playlist and album downloader that pulls tracks from Spotify, Apple Music, Tidal, Deezer, SoundCloud, Bandcamp and more as YouTube audio, with parallel downloads and a choice of format and bitrate

  - title: nyxt / qute
    category: Browsing
    description: keyboard-driven browsers

  - title: monitui
