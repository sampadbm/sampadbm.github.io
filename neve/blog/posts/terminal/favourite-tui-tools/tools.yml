tools:
  - title: rovr
    category: File Management & Navigation
    description: a terminal file manager

  - title: clipse
    category: File Management & Navigation
    description: clipboard manager in the terminal

  - title: dawn
    category: Editing & Writing
    description: a terminal markdown editor with LaTeX rendering

  - title: tangent / apostrophe
    category: Editing & Writing
    description: markdown editor with LaTeX support and organizing thinking notes

  - title: mcat
    category: Editing & Writing
    description: cat on steroids, with support for all filetypes

  - title: espanso
