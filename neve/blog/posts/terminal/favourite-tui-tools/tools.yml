    description: a cross-platform text expander written in Rust

  - title: edamame
    category: Editing & Writing
    description: a terminal markdown editor that stays rendered while you edit, with inline images, Mermaid diagrams, LaTeX math, and cell-by-cell table editing
    url: "https://github.com/mijowi/edamame"

  - title: presenterm / kyma
    category: Presentations
    description: markdown-based presentations with LaTeX/Typst support

  - title: cobib / papis / bibiman / bibman
    category: Bibliography
    description: terminal bibliography managers (Python-based)

  - title: crush
