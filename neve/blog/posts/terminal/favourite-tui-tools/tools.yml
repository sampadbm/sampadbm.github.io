  - title: caligula
    category: System & Networking
    description: user-friendly TUI for imaging disks (modern dd alternative with validation)

  - title: bottles
    category: System & Networking
    description: run Windows software on Linux

  - title: gendesk
    category: System & Networking
    description: generate .desktop files for Linux apps
