    description: terminal-based AI coding IDE by Charm (supports all models, like Cursor)

  - title: Claude / antigravity / cursor
    category: Development
    description: AI coding agents

  - title: codesnap
    category: Development
    description: take screenshots of code

  - title: bin
    category: Development
    description: effortless binary install

  - title: octotype / smassh
    category: Productivity
    description: typing trainers on the terminal

  - title: clavirio
    category: Productivity
    description: a terminal typing tutor with an on-screen keyboard, built-in lessons, and session logging

  - title: podliner
    category: Productivity
    description: listen to podcasts in the terminal

  - title: jotl
    category: Productivity
    description: battery monitor

  - title: spotatui
    category: Productivity
    description: a Spotify player for the terminal

  - title: cliamp
    category: Productivity
    description: a retro terminal music player inspired by Winamp, with local and streaming playback, playlists, a spectrum visualizer, and an equalizer

  - title: soundcli
